<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과일 짝맞추기 - 뇌 건강 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f5ee;--ink:#3a2147;--panel:#fff;--back1:#ff8fa3;--back2:#ff6f91;--front:#fffdf5;--ok:#3fae6a;--okbg:#d9f5e3;--gold:#ffc83d;--shadow:rgba(58,33,71,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2b2a;--ink:#fbeef5;--panel:#2e3d3b;--front:#fff6e0;--okbg:#2f6b4a;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1f2b2a;--ink:#fbeef5;--panel:#2e3d3b;--front:#fff6e0;--okbg:#2f6b4a;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px}
h1{font-size:clamp(26px,6vw,38px);margin:4px 0 2px;text-align:center}
.sub{margin:0 0 12px;font-size:clamp(16px,3.6vw,20px);text-align:center;opacity:.8}
.stats{display:flex;gap:12px;width:min(94vw,560px);margin-bottom:14px}
.stat{flex:1;background:var(--panel);border-radius:22px;padding:8px 6px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.stat span{display:block;font-size:clamp(16px,3.8vw,20px)}
.stat b{display:block;font-size:clamp(40px,11vw,64px);line-height:1.1;color:var(--back2)}
.stat.t b{color:#3b8fd9}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.4vw,14px);width:min(94vw,560px)}
.card{aspect-ratio:1;border:0;padding:0;background:none;perspective:700px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:20px}
.card:focus-visible{outline:4px solid #3b8fd9;outline-offset:3px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--shadow)}
.back{background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.55) 0 7%,transparent 8%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.4) 0 6%,transparent 7%),linear-gradient(145deg,var(--back1),var(--back2));font-size:clamp(30px,9vw,52px);color:#fff}
.front{background:var(--front);transform:rotateY(180deg);font-size:clamp(40px,13vw,78px);line-height:1}
.card.done{pointer-events:none}
.card.done .front{background:var(--okbg);outline:4px solid var(--ok);outline-offset:-4px;animation:pop .5s}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(180deg) scale(1)}}
.msg{min-height:34px;margin:14px 0 6px;font-size:clamp(18px,4.4vw,24px);text-align:center}
button.btn{font-family:inherit;font-size:clamp(20px,5vw,26px);background:var(--ok);color:#fff;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 #2a8450}
button.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a8450}
button.btn:focus-visible{outline:4px solid #3b8fd9;outline-offset:3px}
.win{position:fixed;inset:0;background:rgba(40,20,50,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.win.show{display:flex}
.win .box{background:var(--panel);border-radius:30px;padding:26px 22px;text-align:center;max-width:460px;box-shadow:0 8px 0 var(--shadow);animation:rise .6s}
@keyframes rise{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win .big{font-size:60px}
.win h2{font-size:clamp(28px,7vw,40px);margin:6px 0;color:var(--back2);line-height:1.25}
.win p{font-size:clamp(18px,4.6vw,24px);margin:8px 0 18px}
.bit{position:fixed;top:-60px;font-size:34px;z-index:11;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.card.done .front,.win .box{animation:none}.bit{display:none}}
</style>
</head>
<body>
<h1>🍓 과일 짝맞추기 🍌</h1>
<p class="sub">카드를 눌러 같은 과일 두 개를 찾아보세요</p>
<div class="stats">
  <div class="stat t"><span>걸린 시간(초)</span><b id="time">0</b></div>
  <div class="stat"><span>도전 횟수</span><b id="tries">0</b></div>
</div>
<div class="board" id="board" aria-label="카드 16장"></div>
<div class="msg" id="msg">첫 카드를 눌러 시작하세요!</div>
<button class="btn" id="reset">다시 하기</button>

<div class="win" id="win" role="dialog" aria-modal="true">
  <div class="box">
    <div class="big">🎉🍎🎉</div>
    <h2>축하합니다!<br>뇌 활력 지수 100점!</h2>
    <p id="result"></p>
    <button class="btn" id="again">다시 하기</button>
  </div>
</div>

<script>
const FRUITS=['🍎','🍌','🍇','🍓','🍊','🍉','🍑','🍋'];
const board=document.getElementById('board'),timeEl=document.getElementById('time'),triesEl=document.getElementById('tries'),msg=document.getElementById('msg'),win=document.getElementById('win');
let first=null,lock=false,tries=0,found=0,secs=0,timer=null,started=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newGame(){
  clearInterval(timer);timer=null;started=false;first=null;lock=false;tries=0;found=0;secs=0;
  timeEl.textContent=0;triesEl.textContent=0;msg.textContent='첫 카드를 눌러 시작하세요!';
  win.classList.remove('show');
  board.innerHTML='';
  shuffle([...FRUITS,...FRUITS]).forEach((f,i)=>{
    const c=document.createElement('button');
    c.className='card';c.dataset.f=f;c.setAttribute('aria-label','카드 '+(i+1)+'번');
    c.innerHTML='<div class="inner"><div class="face back">❓</div><div class="face front">'+f+'</div></div>';
    c.addEventListener('click',()=>pick(c));
    board.appendChild(c);
  });
}

function pick(c){
  if(lock||c.classList.contains('flip')||c.classList.contains('done'))return;
  if(!started){started=true;timer=setInterval(()=>{secs++;timeEl.textContent=secs;},1000);}
  c.classList.add('flip');
  if(!first){first=c;msg.textContent='같은 과일이 어디 있을까요?';return;}
  tries++;triesEl.textContent=tries;
  const a=first,b=c;first=null;
  if(a.dataset.f===b.dataset.f){
    setTimeout(()=>{a.classList.add('done');b.classList.add('done');},350);
    found++;msg.textContent='맞았어요! 잘하셨어요 👏';
    if(found===FRUITS.length){clearInterval(timer);setTimeout(victory,1000);}
  }else{
    lock=true;msg.textContent='아쉬워요, 다시 찾아볼까요? 🤔';
    setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');lock=false;},1100);
  }
}

function victory(){
  document.getElementById('result').textContent=secs+'초 동안 '+tries+'번 도전해서 모두 찾으셨어요!';
  win.classList.add('show');fanfare();confetti();
}

function fanfare(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC();
    [523,659,784,1047,784,1047,1319].forEach((hz,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.15;
      o.type='triangle';o.frequency.value=hz;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3);
    });
  }catch(e){}
}

function confetti(){
  for(let i=0;i<30;i++){
    const s=document.createElement('div');s.className='bit';
    s.textContent=FRUITS[i%8];s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2.5+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),7000);
  }
}

document.getElementById('reset').addEventListener('click',newGame);
document.getElementById('again').addEventListener('click',newGame);
newGame();
</script>
</body>
</html>
